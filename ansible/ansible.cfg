[defaults]
home = ./.cache
inventory = ./inventory.json
private_key_file = ~/.ssh/univ
host_key_checking = True
collections_path = ./collections
local_tmp = ./.cache/tmp

[inventory]
enable_plugins = yaml
unparsed_is_failed = True

[ssh_connection]
ssh_args = -C -o ControlMaster=no -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=./known_hosts
